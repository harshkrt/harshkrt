<svg width="760" height="220" viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="gridcard" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#21262D" opacity="0.4"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="758" height="218" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <rect x="1" y="1" width="758" height="218" rx="12" fill="url(#gridcard)"/>

  <!-- status badge -->
  <rect x="24" y="24" width="118" height="26" rx="13" fill="#132D1C" stroke="#00D084" stroke-width="1"/>
  <circle cx="40" cy="37" r="4" fill="#00D084">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="52" y="41" font-family="JetBrains Mono, monospace" font-size="12" fill="#00D084">IN PROGRESS</text>

  <!-- title -->
  <text x="24" y="88" font-family="JetBrains Mono, monospace" font-size="22" font-weight="600" fill="#F0F6FC">Distributed Trace Anomaly Detector</text>

  <!-- description -->
  <text x="24" y="116" font-family="Inter, sans-serif" font-size="14" fill="#8B949E">OTel traces &#8594; feature extraction &#8594; Isolation Forest</text>
  <text x="24" y="136" font-family="Inter, sans-serif" font-size="14" fill="#8B949E">&#8594; live anomaly dashboard</text>

  <!-- pipeline mini-diagram -->
  <g transform="translate(24, 156)" font-family="JetBrains Mono, monospace" font-size="11" fill="#58A6FF">
    <rect x="0" y="0" width="80" height="28" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="40" y="18" text-anchor="middle" fill="#F0F6FC">OTel</text>
    <line x1="80" y1="14" x2="104" y2="14" stroke="#30363D" stroke-width="1.5"/>
    <polygon points="104,14 98,10 98,18" fill="#30363D"/>

    <rect x="108" y="0" width="90" height="28" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="153" y="18" text-anchor="middle" fill="#F0F6FC">Features</text>
    <line x1="198" y1="14" x2="222" y2="14" stroke="#30363D" stroke-width="1.5"/>
    <polygon points="222,14 216,10 216,18" fill="#30363D"/>

    <rect x="226" y="0" width="100" height="28" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="276" y="18" text-anchor="middle" fill="#F0F6FC">IsoForest</text>
    <line x1="326" y1="14" x2="350" y2="14" stroke="#30363D" stroke-width="1.5"/>
    <polygon points="350,14 344,10 344,18" fill="#30363D"/>

    <rect x="354" y="0" width="90" height="28" rx="6" fill="#0D2A1D" stroke="#00D084"/>
    <text x="399" y="18" text-anchor="middle" fill="#00D084">Dashboard</text>
  </g>

  <!-- tech tags -->
  <g transform="translate(24, 196)" font-family="JetBrains Mono, monospace" font-size="11" fill="#58A6FF">
    <text x="0" y="12">Next.js</text>
    <text x="60" y="12">Node.js</text>
    <text x="128" y="12">Python</text>
    <text x="184" y="12">Docker</text>
    <text x="240" y="12">OpenTelemetry</text>
  </g>
</svg>
