<svg width="820" height="200" viewBox="0 0 820 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="820" height="200" fill="#0D1117"/>

  <!-- 4 columns: Frontend / Backend / ML-AI / DevOps -->
  <g font-family="JetBrains Mono, monospace" font-size="12">

    <!-- Frontend -->
    <text x="20" y="20" fill="#8B949E">FRONTEND</text>
    <rect x="20" y="32" width="180" height="1" fill="#30363D"/>
    <g fill="#F0F6FC">
      <circle cx="28" cy="54" r="3" fill="#58A6FF"/><text x="40" y="58">React</text>
      <circle cx="28" cy="78" r="3" fill="#58A6FF"/><text x="40" y="82">Next.js</text>
      <circle cx="28" cy="102" r="3" fill="#58A6FF"/><text x="40" y="106">TypeScript</text>
    </g>

    <!-- Backend -->
    <text x="220" y="20" fill="#8B949E">BACKEND</text>
    <rect x="220" y="32" width="180" height="1" fill="#30363D"/>
    <g fill="#F0F6FC">
      <circle cx="228" cy="54" r="3" fill="#00D084"/><text x="240" y="58">Node.js</text>
      <circle cx="228" cy="78" r="3" fill="#00D084"/><text x="240" y="82">Express</text>
      <circle cx="228" cy="102" r="3" fill="#00D084"/><text x="240" y="106">FastAPI</text>
    </g>

    <!-- ML/AI -->
    <text x="420" y="20" fill="#8B949E">ML / AI</text>
    <rect x="420" y="32" width="180" height="1" fill="#30363D"/>
    <g fill="#F0F6FC">
      <circle cx="428" cy="54" r="3" fill="#D2A8FF"/><text x="440" y="58">PyTorch</text>
      <circle cx="428" cy="78" r="3" fill="#D2A8FF"/><text x="440" y="82">scikit-learn</text>
      <circle cx="428" cy="102" r="3" fill="#D2A8FF"/><text x="440" y="106">LangGraph</text>
    </g>

    <!-- DevOps -->
    <text x="620" y="20" fill="#8B949E">DEVOPS</text>
    <rect x="620" y="32" width="180" height="1" fill="#30363D"/>
    <g fill="#F0F6FC">
      <circle cx="628" cy="54" r="3" fill="#F0883E"/><text x="640" y="58">Docker</text>
      <circle cx="628" cy="78" r="3" fill="#F0883E"/><text x="640" y="82">Kubernetes</text>
      <circle cx="628" cy="102" r="3" fill="#F0883E"/><text x="640" y="106">GitHub Actions</text>
    </g>
  </g>
</svg>
